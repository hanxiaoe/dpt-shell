name: 手动打包构建
# 仅网页手动触发，推送/tag不自动执行
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（格式 v2.20.0）
        required: true
        default: v2.20.0
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取代码+子模块
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # JDK17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 安装 ninja
      - name: Install ninja‑build
        run: sudo apt-get update && sudo apt-get install ninja-build -y

      # CMake
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.1'

      # gradlew执行权限
      - name: Grant execute permission gradlew
        run: chmod +x gradlew

      # 编译项目
      - name: Gradle Build
        run: ./gradlew build

      # 校验输出目录，打印版本调试信息
      - name: Check output dir & print version
        run: |
          echo "手动输入版本: ${{ github.event.inputs.version }}"
          ls -la ./executable/

      # 打包压缩包
      - name: Compress artifact
        run: zip -r -q dpt-shell-${{ github.event.inputs.version }}.zip executable/

      # 上传产物，artifact名称带上版本号
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpt-shell-${{ github.event.inputs.version }}
          path: dpt-shell-${{ github.event.inputs.version }}.zip
